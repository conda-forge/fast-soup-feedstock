{% set name = "fast-soup" %}
{% set version = "1.1.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/fast-soup-{{ version }}.tar.gz
  sha256: 1dd5561ad632c80b1fedf1369dddf3ab36f588216507cb036122b58ea1098b25

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 1

requirements:
  host:
    - pip
    - poetry >=0.12
    - python {{ python_min }}
  run:
    - beautifulsoup4 >=4.3.2,<5.0.0
    - cssselect >=1.0.1,<2.0.0
    - lxml >=4.5.0,<5.0.0
    - python >={{ python_min }},<4.0

test:
  imports:
    - fast_soup
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/spumer/FastSoup
  summary: BeautifulSoup interface for lxml
  license: GPL-3.0-or-later
  license_file: LICENSE

extra:
  recipe-maintainers:
    - thewchan
